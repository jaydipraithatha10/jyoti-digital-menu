<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jyoti Gruh Udhyog</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Header -->
    <div id="header"></div>

    <main>

        <!-- Banner -->
        <section class="banner">

            <img src="banner1.png"
                 alt="Banner">

        </section>

        <!-- Search -->
        <section class="search-box">

            <input
                type="text"
                id="search"
                placeholder="Search Products...">

        </section>

        <!-- Categories -->
        <section class="section">

            <h2 class="section-title">

                Shop By Category

            </h2>

            <div
                id="categoryList"
                class="grid">

            </div>

        </section>

    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <script src="include.js"></script>

    <script src="api.js"></script>

</body>

</html>
