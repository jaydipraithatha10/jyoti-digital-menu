<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jyoti Gruh Udhyog</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="header-overlay">

        <div class="top-header">

            <div class="logo-box">

                <img src="logo.png"
                     class="logo"
                     alt="Jyoti Gruh Udhyog">

            </div>

            <div class="company-info">

                <h1>JYOTI</h1>

                <h2>GRUH UDHYOG</h2>

                <p class="location">
                    📍 Rajkot
                </p>

                <p class="tagline">
                    100+ Variety of Snacks Under One Roof
                </p>

                <a href="tel:+919712149344"
                   class="call-btn">

                    📞 +91 97121 49344

                </a>

            </div>

        </div>

    </div>

</header>
<!-- ================= SEARCH ================= -->

<section class="search-section">

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search Products...">

    </div>

</section>


<!-- ================= CATEGORY TITLE ================= -->

<section class="section-title">

    <h3>Shop By Category</h3>

</section>


<!-- ================= CATEGORIES ================= -->

<section id="categories" class="categories">

    <!-- Categories, Sub Categories & Products
         Google Sheet માંથી અહીં Load થશે -->

</section>
<!-- ================= CART BAR ================= -->

<div id="cart-bar" class="cart-bar" style="display:none;">

    <div class="cart-info">

        <span id="cart-count">0</span> Items |
        <span id="cart-total">₹ 0</span>

    </div>

    <button onclick="openWhatsAppCart()">
        Order Now
    </button>

</div>


<!-- ================= CART POPUP ================= -->

<div id="cartPopup" class="cart-popup">

    <div class="cart-header">

        <h2>Your Cart</h2>

        <button onclick="closeCart()">
            ✖
        </button>

    </div>

    <div id="cartItems" class="cart-items">

        <!-- Cart Items Here -->

    </div>

    <div class="cart-total-box">

        <h3>
            Total :
            <span id="grandTotal">₹ 0</span>
        </h3>

    </div>

    <div class="customer-form">

        <input
            type="text"
            id="customerName"
            placeholder="Customer Name">

        <input
            type="tel"
            id="customerMobile"
            placeholder="Mobile Number">

        <textarea
            id="customerAddress"
            placeholder="Delivery Address"></textarea>

        <button onclick="sendWhatsAppOrder()">
            Place Order on WhatsApp
        </button>

    </div>

</div>
